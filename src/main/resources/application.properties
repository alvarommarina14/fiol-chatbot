spring.application.name=fiol-chatbot
spring.jackson.property-naming-strategy=SNAKE_CASE

# No database is wired up for this MVP; spring-boot-starter-data-jpa stays in
# build.gradle unused for now, so auto-configuration must not try to open a DataSource.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration

whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN}
whatsapp.app-secret=${WHATSAPP_APP_SECRET}
whatsapp.api-version=${WHATSAPP_API_VERSION:v21.0}
whatsapp.graph-base-url=${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com}
whatsapp.strip-ar-mobile-nine=${WHATSAPP_STRIP_AR_MOBILE_NINE:false}
